name: Build & Release WinIsleSetup (Tauri 2.0 Edition)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versi Release Tag (contoh: v1.2.5)'
        required: false
        default: 'v1.2.5'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Clean unused chat media assets before build
        shell: pwsh
        run: |
          if (Test-Path "public/assets/aistudio") {
            Remove-Item -Recurse -Force "public/assets/aistudio"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-package-lock
          npm install --no-save @rolldown/binding-win32-x64-msvc@1.2.15 --legacy-peer-deps
          $winNode = "node_modules/@rolldown/binding-win32-x64-msvc/rolldown-binding.win32-x64-msvc.node"
          if (Test-Path $winNode) {
            Copy-Item $winNode -Destination "node_modules/rolldown/rolldown-binding.win32-x64-msvc.node" -Force
          }

      - name: Build Web App
        run: npm run build

      - name: Build Standalone Binary via Cargo
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Bundle (NSIS Installer)
        run: npx @tauri-apps/cli build
        continue-on-error: true

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          $exePath = "src-tauri\target\release\winisle.exe"
          if (Test-Path $exePath) {
            Copy-Item $exePath -Destination "release\winisle.exe"
            Compress-Archive -Path $exePath -DestinationPath "release\WinIsle-portable.zip" -Force
          }
          $nsisPath = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisPath) {
            Copy-Item $nsisPath.FullName -Destination "release\WinIsleSetup.exe"
          } elseif (Test-Path $exePath) {
            Copy-Item $exePath -Destination "release\WinIsleSetup.exe"
          }

      - name: Upload Artifacts to Workflow Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinIsle-Package
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.tag_name || 'v1.2.5' }}
          name: WinIsle ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.tag_name || 'v1.2.5' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ## WinIsle Dynamic Island for Windows v1.2.5 (Tauri 2.0 Edition)
            - **Super Ramping**: Ukuran binary mandiri hanya **~2.9 MB** (mengalahkan Nusa 5.15 MB, 98% lebih kecil dari versi Electron terdahulu).
            - **Hemat RAM**: Konsumsi memori hanya **~22 MB** saat aktif.
            - **Bebas Kotak Putih**: Transparansi 100% menggunakan native Windows DWM glass extension.
            - **Deteksi Volume 0 ms**: Aliran CoreAudio native langsung ke UI, responsif saat ditekan beruntun.
            - **Multimodal AI**: Tetap terintegrasi penuh dengan Gemini Voice, Chat Alt+Q, Instant Mini Capsule Alt+H, Weather, dan Synced Lyrics.
          files: |
            release/*.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
