name: Build & Release WinIsleSetup (Tauri 2.0 Edition)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versi Release Tag (contoh: v1.2.5)'
        required: false
        default: 'v1.2.5'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Build Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean unused chat media assets before build
        shell: pwsh
        run: |
          if (Test-Path "public/assets/aistudio") {
            Remove-Item -Recurse -Force "public/assets/aistudio"
          }

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Tauri & Tray Icons + Build Frontend
        run: |
          node scripts/generate-tray-icon.mjs
          npm run build

      - name: Build WinIsle Tauri 2.0 Native Binary & NSIS Installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Package WinIsleSetup.exe, winisle.exe & WinIsle-portable.zip
        run: node scripts/package-release-zip.mjs

      - name: Upload Artifacts to Workflow Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinIsle-Tauri2-Package
          path: |
            release/WinIsleSetup.exe
            release/winisle.exe
            release/WinIsle-portable.zip
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name || 'v1.2.5' }}
          name: WinIsle ${{ inputs.tag_name || github.ref_name || 'v1.2.5' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ## WinIsle Dynamic Island for Windows (Tauri 2.0 Edition)
            - **Super Ramping**: Ukuran binary mandiri & installer hanya **~3–10 MB** (90%+ lebih kecil dari versi Electron 91 MB, bebas aset sampah).
            - **Hemat RAM**: Konsumsi memori hanya **~22 MB** saat aktif dengan native working-set trimmer.
            - **Bebas Kotak Putih**: Transparansi 100% menggunakan native Windows WebView2 & layered click-through.
            - **Deteksi Volume 0 ms**: Aliran CoreAudio native langsung ke UI, responsif saat ditekan beruntun.
            - **Multimodal AI**: Terintegrasi penuh dengan Gemini 3.1 Flash Lite & 3.8 Flash, Chat `Alt+Q`, Instant Mini Capsule `Alt+H`, Weather, dan Synced Lyrics.
          files: |
            release/WinIsleSetup.exe
            release/winisle.exe
            release/WinIsle-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

